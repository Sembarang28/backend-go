apiVersion: batch/v1
kind: Job
metadata:
  name: backend-go-migration
  namespace: default
  labels:
    app.kubernetes.io/name: backend-go
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-go
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: migrator
          image: ghcr.io/giriaditya/backend-go:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/migrate"]
          envFrom:
            - configMapRef:
                name: backend-go-config
            - secretRef:
                name: backend-go-secrets
                optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
