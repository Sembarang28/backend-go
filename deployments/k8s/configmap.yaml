apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-go-config
  namespace: default
data:
  APP_ENV: "production"
  SERVER_ADDRESS: ":8080"
  GRPC_ADDRESS: ":50051"
  READ_TIMEOUT: "5s"
  WRITE_TIMEOUT: "10s"
  SHUTDOWN_TIMEOUT: "15s"
  DB_MAX_OPEN_CONNS: "25"
  DB_MAX_IDLE_CONNS: "10"
  DB_CONN_MAX_LIFETIME: "30m"
  DB_CONN_MAX_IDLE_TIME: "5m"
  REDIS_MODE: "single"
  REDIS_ADDRESSES: "redis.default.svc.cluster.local:6379"
  REDIS_DB: "0"
  CACHE_TTL: "5m"
